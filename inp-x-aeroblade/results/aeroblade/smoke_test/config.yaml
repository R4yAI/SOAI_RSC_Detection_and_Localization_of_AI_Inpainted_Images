experiment: aeroblade_x_inpx_smoke_test
manifest: /teamspace/studios/this_studio/inp-x-aeroblade/manifests/manifest_test-data_smoke.csv
output_dir: /teamspace/studios/this_studio/inp-x-aeroblade/results/aeroblade/smoke_test
forensic_autoencoder: runwayml/stable-diffusion-v1-5
lpips_distance: LPIPS
lpips_backbone: vgg
lpips_spatial_layer_index: 2
latent_sampling_seed: 42
device: cuda
triplet_batch_size: 2
save_reconstructions: false
heatmap_dtype: float16
score_convention: AEROBLADE native negative error (-E)
anomaly_map_convention: A(x,y) = -E(x,y) (Option A)
upsampling: bilinear_antialias
input_range: '[0,1] -> [-1,1] for VAE'
streaming_reconstruction: true
thresholded_localization_rules:
- per-image Otsu on -E
- swept optimal F1/IoU (IoU_max)
